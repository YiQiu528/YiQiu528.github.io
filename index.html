  <h1>XxtCalendar</h1>
  <p>个人使用的 Windows 本地日程同步工具。</p>
  <p>
    将学习通课程及作业信息同步到用户授权的
    Google Calendar，方便管理学习计划和截止时间。
  </p>
  <p>
    应用通过 Google OAuth 获取日历访问授权，
    用于创建及更新与学习任务相关的日历事件。
  </p>
